spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_db
    username: reservation_user
    password: reservation_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        format_sql: false

    show-sql: false

security:
  jwt:
    secret: "reservation-service-local-jwt-signing-key-2026-dev"
    access-token-ttl: 15m

external:
  payment:
    base-url: http://localhost:8080/mock/payments
    connect-timeout: 1s
    read-timeout: 2s

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true
