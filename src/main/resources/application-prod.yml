spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        format_sql: false

    show-sql: false

security:
  jwt:
    secret: ${JWT_SIGNING_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

external:
  payment:
    base-url: ${PAYMENT_SERVICE_URL}
    connect-timeout: ${PAYMENT_CONNECT_TIMEOUT:1s}
    read-timeout: ${PAYMENT_READ_TIMEOUT:2s}

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false
