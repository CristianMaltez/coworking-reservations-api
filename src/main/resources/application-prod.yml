spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    properties:
      hibernate:
        format_sql: false

    show-sql: false

security:
  jwt:
    secret: ${JWT_SIGNING_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
